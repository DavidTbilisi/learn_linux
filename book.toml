[book]
title = "Linux-ის გზამკვლევი"
authors = ["DavidTbilisi"]
description = "Linux-ის გზამკვლევი ქართულად — ბრძანებები, მაგალითები, სავარჯიშოები"
language = "ka"
src = "."

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/DavidTbilisi/learn_linux"
edit-url-template = "https://github.com/DavidTbilisi/learn_linux/edit/main/{path}"
site-url = "/learn_linux/"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2

[output.html.fold]
enable = true
level = 1
